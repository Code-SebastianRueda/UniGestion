<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
}

.box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div class="box">

    <h4 class="text-center mb-3">HR Platform</h4>

    <!-- LOGIN -->
    <input id="loginEmail" class="form-control mb-2" placeholder="Email">
    <input id="loginPass" type="password" class="form-control mb-3" placeholder="Password">

    <button type="button" class="btn btn-primary w-100 mb-3" onclick="login()">Login</button>

    <hr>

    <!-- REGISTER -->
    <h5>Registro</h5>

    <input id="regName" class="form-control mb-2" placeholder="Nombre">
    <input id="regEmail" class="form-control mb-2" placeholder="Email">
    <input id="regPass" type="password" class="form-control mb-2" placeholder="Password">
    <input id="regId" class="form-control mb-2" placeholder="Identificación">

    <button type="button" class="btn btn-success w-100" onclick="register()">Registrarse</button>

</div>

<script>

// 🔥 SOLO redirige si YA está logueado
const user = JSON.parse(localStorage.getItem("user"));

if (user) {
    if (user.role === "candidate") window.location.href = "/candidate.html";
    if (user.role === "employee") window.location.href = "/employee.html";
    if (user.role === "rh") window.location.href = "/rh.html";
}


// LOGIN
async function login() {

    const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: document.getElementById("loginEmail").value,
            password: document.getElementById("loginPass").value
        })
    });

    const data = await res.json();

    console.log("LOGIN RESPONSE:", data);

    if (data.error) {
        alert(data.error);
        return;
    }

    localStorage.setItem("user", JSON.stringify(data));

    if (data.role === "candidate") window.location.href = "/candidate.html";
    if (data.role === "employee") window.location.href = "/employee.html";
    if (data.role === "rh") window.location.href = "/rh.html";
}


// REGISTER
async function register() {

    try {
        const res = await fetch("/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                id: regId.value,
                name: regName.value,
                email: regEmail.value,
                password: regPass.value
            })
        });

        const data = await res.json();

        if (data.error) return alert(data.error);

        alert("Usuario creado correctamente");

    } catch (e) {
        console.error(e);
        alert("Error en registro");
    }
}

</script>

</body>
</html>
