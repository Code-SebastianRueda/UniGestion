<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portal Empleado</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f5f7fa;
}

.container {
    margin-top: 40px;
}

.card {
    border-radius: 15px;
}
</style>
</head>

<body>

<div class="container">

    <div class="d-flex justify-content-between mb-4">
        <h3>👨‍💼 Perfil del Empleado</h3>
        <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
    </div>

    <div class="card p-4">

        <h5>Información Personal</h5>

        <input id="name" class="form-control mb-2" disabled>
        <input id="email" class="form-control mb-2" disabled>
        <input id="position" class="form-control mb-2" disabled>
        <input id="salary" class="form-control mb-2" disabled>
        <input id="start_date" class="form-control mb-2" disabled>

        <hr>

        <h5>Datos Editables</h5>

        <input id="phone" class="form-control mb-2" placeholder="Teléfono">
        <input id="address" class="form-control mb-3" placeholder="Dirección">

        <button class="btn btn-primary w-100" onclick="updateProfile()">Actualizar</button>

    </div>
    <div class="card p-4 mt-4">

    <h5>🏖️ Vacaciones</h5>

    <div id="vacationsList" class="mb-3"></div>

    <h6>Solicitar vacaciones</h6>

    <input id="start_date" type="date" class="form-control mb-2">
    <input id="end_date" type="date" class="form-control mb-2">
    <input id="days" type="number" class="form-control mb-2" placeholder="Días">

    <button class="btn btn-success w-100" onclick="requestVacation()">Solicitar</button>

    <div class="card p-4 mt-4">

    <h5>💰 Nómina</h5>

    <div id="payrollList"></div>

    <div class="card p-4 mt-4">

    <h5>📄 Certificado Laboral</h5>

    <button class="btn btn-success w-100" onclick="downloadCertificate()">
        Descargar Certificado
    </button>

    </div>
    <div class="card p-4 mt-4">
    <h5>🧾 Solicitudes</h5>

    <select id="req_type" class="form-control mb-2">
        <option>Certificado</option>
        <option>Permiso</option>
        <option>Actualización datos</option>
    </select>

    <textarea id="req_desc" class="form-control mb-2" placeholder="Descripción"></textarea>

    <button class="btn btn-warning w-100" onclick="sendRequest()">Enviar</button>
    </div>

    <div class="card p-3">
    <h6>Resumen</h6>
    <p>Vacaciones disponibles: 12 días</p>
    <p>Última nómina: $4.100.000</p>
    </div>

</div>
</div>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
    window.location.href = "/auth.html";
}

// 🔥 CARGAR PERFIL
async function loadProfile() {

    try {
        const res = await fetch(`/employee/${user.id}`);
        const data = await res.json();

        console.log("DATA:", data); // 🔥 DEBUG

        if (data.error) {
            alert(data.error);
            return;
        }

        document.getElementById("name").value = data.name || "";
        document.getElementById("email").value = data.email || "";
        document.getElementById("position").value = data.position || "";
        document.getElementById("salary").value = data.salary || "";
        document.getElementById("start_date").value = data.start_date || "";

        document.getElementById("phone").value = data.phone || "";
        document.getElementById("address").value = data.address || "";

    } catch (e) {
        console.error(e);
        alert("Error cargando perfil");
    }
}

async function sendRequest() {

    await fetch("/requests", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            user_id: user.id,
            type: req_type.value,
            description: req_desc.value
        })
    });

    alert("Solicitud enviada");
}

// 🔥 ACTUALIZAR
async function updateProfile() {

    await fetch(`/employee/${user.id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            phone: phone.value,
            address: address.value
        })
    });

    alert("Perfil actualizado");
}

// 🔐 LOGOUT
function logout() {
    localStorage.removeItem("user");
    window.location.href = "/auth.html";
}
async function loadVacations() {

    const res = await fetch(`/vacations/${user.id}`);
    const data = await res.json();

    const container = document.getElementById("vacationsList");

    container.innerHTML = "";

    if (data.length === 0) {
        container.innerHTML = "<p>No tienes vacaciones registradas</p>";
        return;
    }

    data.forEach(v => {
        container.innerHTML += `
            <div class="border p-2 mb-2 rounded">
                <strong>${v.start_date} → ${v.end_date}</strong><br>
                Días: ${v.days}<br>
                Estado: <span class="badge bg-${v.status === 'approved' ? 'success' : 'warning'}">${v.status}</span>
            </div>
        `;
    });
}

async function requestVacation() {

    const payload = {
        user_id: user.id,
        start_date: document.getElementById("start_date").value,
        end_date: document.getElementById("end_date").value,
        days: parseInt(document.getElementById("days").value)
    };

    console.log("ENVIANDO:", payload); // 🔥 DEBUG

    const res = await fetch("/vacations/request", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    alert("Solicitud enviada");

    loadVacations();
}

async function loadPayroll() {

    const res = await fetch(`/payroll/${user.id}`);
    const data = await res.json();

    const container = document.getElementById("payrollList");

    container.innerHTML = "";

    data.forEach(p => {
        container.innerHTML += `
            <div class="border p-2 mb-2 rounded">
                <strong>${p.period}</strong><br>
                Neto: $${p.net_salary}<br>
                <button class="btn btn-sm btn-primary"
                    onclick="downloadPayroll(${p.id})">
                    Descargar
                </button>
            </div>
        `;
    });
}

function downloadPayroll(id) {
    window.open(`/payroll/download/${id}`, "_blank");
}

function downloadCertificate() {
    window.open(`/employee/certificate/${user.id}`, "_blank");
}



// INIT
loadProfile();
loadVacations();
loadPayroll();

</script>

</body>
</html>
