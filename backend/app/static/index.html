<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HR Platform</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* LOGIN */
#auth {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
}

.auth-box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* APP */
#app {
    display: none;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    background: #1f2937;
    color: white;
    padding: 20px;
}

.sidebar h4 {
    margin-bottom: 30px;
}

.sidebar button {
    width: 100%;
    margin-bottom: 10px;
    border-radius: 8px;
}

/* MAIN */
.main {
    flex: 1;
    padding: 25px;
    background: #f3f4f6;
    overflow-y: auto;
}

/* CARDS */
.card-custom {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

/* CHAT */
.chat-box {
    height: 400px;
    overflow-y: auto;
    background: #f9fafb;
    padding: 10px;
    border-radius: 10px;
}

.message {
    margin: 10px 0;
}

.user {
    text-align: right;
}

.bot {
    text-align: left;
}

.bubble {
    display: inline-block;
    padding: 10px;
    border-radius: 12px;
    max-width: 70%;
}

.user .bubble {
    background: #2563eb;
    color: white;
}

.bot .bubble {
    background: #e5e7eb;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth">
    <div class="auth-box">

        <h4 class="text-center mb-3">HR Platform</h4>

        <input id="loginEmail" class="form-control mb-2" placeholder="Email">
        <input id="loginPass" type="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-primary w-100 mb-3" onclick="login()">Login</button>

        <hr>

        <h5>Registro</h5>

        <input id="regName" class="form-control mb-2" placeholder="Nombre">
        <input id="regEmail" class="form-control mb-2" placeholder="Email">
        <input id="regPass" type="password" class="form-control mb-2" placeholder="Password">

        <select id="role" class="form-control mb-3">
            <option value="candidate">Candidato</option>
            <option value="rh">RH</option>
        </select>

        <button class="btn btn-success w-100" onclick="register()">Registrarse</button>

    </div>
</div>

<!-- APP -->
<div id="app" class="d-flex">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h4>HR Platform</h4>

        <button class="btn btn-light" onclick="showSection('candidate')">Mi Perfil</button>
        <button class="btn btn-light" onclick="showSection('chat')">Chat RH</button>
        <button class="btn btn-light" onclick="showSection('employees')">Empleados</button>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- CANDIDATO -->
        <div id="candidate" class="section">
            <div class="card-custom">
                <h4>Subir Hoja de Vida</h4>

                <input type="file" id="file" class="form-control mb-3">

                <button class="btn btn-success" onclick="uploadCV()">Subir CV</button>
            </div>
        </div>

        <!-- CHAT -->
        <div id="chat" class="section" style="display:none;">
            <div class="card-custom">
                <h4>Chat RH</h4>

                <div id="chatBox" class="chat-box"></div>

                <div class="input-group mt-2">
                    <input id="chatInput" class="form-control" placeholder="Escribe..." onkeypress="handleKeyPress(event)">
                    <button class="btn btn-dark" onclick="sendMessage()">Enviar</button>
                </div>
            </div>
        </div>

        <!-- EMPLEADOS -->
        <div id="employees" class="section" style="display:none;">
            <div class="card-custom">
                <h4>Certificado Laboral</h4>

                <input id="employeeId" class="form-control mb-2" placeholder="ID empleado">
                <button class="btn btn-primary" onclick="downloadCertificate()">Descargar</button>
            </div>
        </div>

    </div>

</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
    window.location.href = "/auth.html";
}


let currentUser = null;

// LOGIN
async function login() {

    const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: loginEmail.value,
            password: loginPass.value
        })
    });

    const data = await res.json();

    if (data.error) return alert(data.error);

    currentUser = data;

    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "flex";
}

// REGISTER
async function register() {

    await fetch("/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: regName.value,
            email: regEmail.value,
            password: regPass.value,
            role: role.value
        })
    });

    alert("Usuario creado");
}

// NAV
function showSection(id) {
    document.querySelectorAll(".section").forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "block";
}

// CHAT
function addMessage(text, type) {
    const chat = document.getElementById("chatBox");

    const div = document.createElement("div");
    div.className = `message ${type}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerText = text;

    div.appendChild(bubble);
    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

function handleKeyPress(e) {
    if (e.key === "Enter") sendMessage();
}

async function sendMessage() {

    const msg = chatInput.value;

    if (!msg) return;

    addMessage(msg, "user");
    chatInput.value = "";

    const res = await fetch("/chat-match", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    });

    const data = await res.json();

    addMessage(data.response, "bot");
}

// UPLOAD CV
async function uploadCV() {

    let formData = new FormData();
    formData.append("file", file.files[0]);

    await fetch(`/upload-cv/${currentUser.id}`, {
        method: "POST",
        body: formData
    });

    alert("CV subido");
}

// CERTIFICADO
function downloadCertificate() {
    window.open(`/employees/${employeeId.value}/certificate`);
}

</script>

</body>
</html>
