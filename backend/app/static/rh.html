<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel RH</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f3f4f6;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

/* CHAT */
.chat-box {
    height: 400px;
    overflow-y: auto;
    background: #ffffff;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.message {
    margin: 10px 0;
}

.user {
    text-align: right;
}

.bot {
    text-align: left;
}

.bubble {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 70%;
}

.user .bubble {
    background: #2563eb;
    color: white;
}

.bot .bubble {
    background: #e5e7eb;
}
</style>
</head>

<body class="p-4">

<!-- 🔐 PROTECCIÓN -->
<script>
const user = JSON.parse(localStorage.getItem("user"));

if (!user || user.role !== "rh") {
    window.location.href = "/auth.html";
}
</script>

<!-- HEADER -->
<div class="header">
    <h3>Panel RH</h3>
    <div>
        <span id="welcome"></span>
        <button class="btn btn-danger btn-sm ms-2" onclick="logout()">Cerrar sesión</button>
    </div>
</div>

<!-- CHAT -->
<div class="card p-3 shadow-sm">
    <h5>Chat de Reclutamiento</h5>

    <div id="chatBox" class="chat-box"></div>

    <div class="input-group mt-3">
        <input id="msg" class="form-control" placeholder="Ej: Necesito profesor de Python con 5 años">
        <button class="btn btn-dark" onclick="send()">Enviar</button>
    </div>
</div>

<div class="card p-4 mt-4">

    <h5>🏖️ Gestión de Vacaciones</h5>

    <div id="vacationsRH"></div>

</div>

<script>

loadVacationsRH();

// 👋 Bienvenida
document.getElementById("welcome").innerText = "👋 " + user.name;



// 🔐 LOGOUT
function logout() {
    localStorage.removeItem("user");
    window.location.href = "/auth.html";
}

async function loadVacationsRH() {

    const res = await fetch("/rh/vacations");
    const data = await res.json();

    const container = document.getElementById("vacationsRH");

    container.innerHTML = "";

    data.forEach(v => {
        container.innerHTML += `
            <div class="border p-2 mb-2 rounded">
                <strong>${v.employee_name}</strong><br>
                ${v.start_date} → ${v.end_date}<br>
                Días: ${v.days}<br>
                Estado: <b>${v.status}</b><br>

                ${
                    v.status === "pending" ? `
                    <button class="btn btn-success btn-sm" onclick="approve(${v.id})">Aprobar</button>
                    <button class="btn btn-danger btn-sm" onclick="reject(${v.id})">Rechazar</button>
                    ` : ""
                }
            </div>
        `;
    });
}

async function approve(id) {

    await fetch(`/rh/vacations/${id}/approve`, {
        method: "PUT"
    });

    loadVacationsRH();
}

async function reject(id) {

    await fetch(`/rh/vacations/${id}/reject`, {
        method: "PUT"
    });

    loadVacationsRH();
}

// 💬 AGREGAR MENSAJE
function addMessage(text, type) {

    const chat = document.getElementById("chatBox");

    const div = document.createElement("div");
    div.className = `message ${type}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerText = text;

    div.appendChild(bubble);
    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


// ⌨️ ENTER FUNCIONA
document.getElementById("msg").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        send();
    }
});


// 🚀 ENVÍO DE MENSAJE
async function send() {

    const input = document.getElementById("msg");
    const text = input.value;

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    try {
        const res = await fetch("/chat-match", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: text})
        });

        if (!res.ok) {
            const err = await res.text();
            console.error(err);
            addMessage("❌ Error backend", "bot");
            return;
        }

        const data = await res.json();

        addMessage(data.response, "bot");

    } catch (e) {
        console.error(e);
        addMessage("❌ Error conexión", "bot");
    }
}
</script>


</body>
</html>
