<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniGestión HR - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1><i class="bi bi-people-fill"></i> UniGestión</h1>
                <p>Plataforma de Recursos Humanos</p>
            </div>

            <div id="alert-container"></div>

            <!-- Login Form -->
            <div id="login-form">
                <h5 class="text-center mb-4">Iniciar Sesión</h5>
                <form onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="login-email" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3" id="btn-login">Ingresar</button>
                </form>
                <p class="text-center text-muted">
                    ¿No tienes cuenta? <a href="#" onclick="toggleForm('register')">Regístrate aquí</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="register-form" style="display: none;">
                <h5 class="text-center mb-4">Crear Cuenta</h5>
                <form onsubmit="handleRegister(event)">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="reg-name" placeholder="Juan Pérez" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="reg-email" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="reg-confirm" placeholder="Repite la contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3" id="btn-register">Registrarse</button>
                </form>
                <p class="text-center text-muted">
                    ¿Ya tienes cuenta? <a href="#" onclick="toggleForm('login')">Inicia sesión</a>
                </p>
            </div>

            <!-- Demo Credentials -->
            <div class="mt-4 p-3 rounded" style="background: #f8f9fa; font-size: 12px;">
                <strong>Credenciales Demo:</strong><br>
                <span class="text-muted">RH:</span> admin@unigestion.com / admin123<br>
                <span class="text-muted">Empleado:</span> empleado@unigestion.com / emp123<br>
                <span class="text-muted">Candidato:</span> candidato@unigestion.com / cand123
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        // Redirect if already logged in
        if (isAuthenticated()) {
            const user = getUser();
            if (user.role === 'rh') window.location.href = '/rh';
            else if (user.role === 'employee') window.location.href = '/employee';
            else window.location.href = '/candidate';
        }

        function toggleForm(form) {
            document.getElementById('login-form').style.display = form === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = form === 'register' ? 'block' : 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            showLoading(btn);

            try {
                const data = await apiCall('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-password').value
                    })
                });

                setAuth(data.token, data.user);

                if (data.user.role === 'rh') window.location.href = '/rh';
                else if (data.user.role === 'employee') window.location.href = '/employee';
                else window.location.href = '/candidate';
            } catch (error) {
                showAlert(error.message, 'danger');
            } finally {
                hideLoading(btn);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (password !== confirm) {
                showAlert('Las contraseñas no coinciden', 'danger');
                return;
            }

            const btn = document.getElementById('btn-register');
            showLoading(btn);

            try {
                const data = await apiCall('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        full_name: document.getElementById('reg-name').value,
                        email: document.getElementById('reg-email').value,
                        password: password
                    })
                });

                setAuth(data.token, data.user);
                window.location.href = '/candidate';
            } catch (error) {
                showAlert(error.message, 'danger');
            } finally {
                hideLoading(btn);
            }
        }
    </script>
</body>
</html>
